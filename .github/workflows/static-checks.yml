name: Source and reporting checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting dependencies
        run: python -m pip install -r src/reporting/requirements.txt
      - name: Check repository structure
        run: python tests/check_repository.py
      - name: Check source construction contract
        run: python tests/test_source_first.py
      - name: Check reporting excludes failed stages
        run: python tests/test_reporting.py
      - name: Check GitHub packaging and source hashes
        run: python tests/test_github_ready.py
